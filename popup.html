<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WHIP-SLASH</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080911;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 800px;
      height: 500px;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 500px;
      background: #020307;
      overflow: hidden;
    }

    /* Target main game canvas specifically so it doesn't stretch the preview canvas */
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* HUD Overlay */
    .hud {
      position: absolute;
      top: 12px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 5;
    }

    .hud-label-hp { font-size: 10px; color: #ff0055; }
    .hud-label-score { font-size: 10px; color: #00ffcc; }
    .score-box { text-align: right; }

    .hp-bar-outer {
      width: 180px;
      height: 14px;
      background: #111827;
      border: 1px solid #ff0055;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .hp-bar-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff0055, #ff5500);
      transition: width 0.1s ease-out;
    }

    .score-text {
      font-size: 20px;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }

    /* Screen Overlays */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 5, 12, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      text-align: center;
    }

    .hidden { display: none !important; }

    h1 {
      font-size: 38px;
      color: #00ffcc;
      text-shadow: 0 0 12px #00ffcc, 2px 2px #ff0055;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .over-title {
      color: #ff0055;
      text-shadow: 0 0 12px #ff0055;
    }

    p {
      font-size: 13px;
      color: #88aacc;
      margin-bottom: 20px;
      max-width: 440px;
      line-height: 1.5;
    }

    .btn {
      background: linear-gradient(180deg, #00ffcc 0%, #009977 100%);
      color: #000;
      border: none;
      padding: 10px 24px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
      transition: all 0.15s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 16px rgba(0, 255, 204, 0.8);
    }

    /* Fixed Enemy Preview Canvas Dimensions */
    #enemy-preview-canvas {
      width: 130px;
      height: 130px;
      background: rgba(10, 15, 30, 0.8);
      border: 1px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
      margin-bottom: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div>
        <div class="hud-label-hp">HEALTH</div>
        <div class="hp-bar-outer"><div class="hp-bar-inner" id="hp-bar"></div></div>
      </div>
      <div class="score-box">
        <div class="hud-label-score">KILLS / SCORE</div>
        <div class="score-text" id="score-val">0</div>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- START SCREEN -->
    <div class="overlay" id="start-screen">
      <h1>WHIP-SLASH</h1>
      <p>
        • <b>MOVE:</b> A / D or Left / Right Arrows<br>
        • <b>JUMP:</b> W, Up Arrow, or Space<br>
        • <b>DASH:</b> Left Mouse Click<br>
        • <b>ATTACK:</b> Whip your mouse fast! Kinetic speed slashes through enemies.
      </p>
      <button class="btn" id="start-btn">ENTER ARENA</button>
    </div>

    <!-- NEW ENEMY POPUP SCREEN -->
    <div class="overlay hidden" id="enemy-intro-overlay">
      <div style="font-size: 11px; color: #ff0055; letter-spacing: 2px; font-weight: bold; margin-bottom: 4px;">WARNING: NEW ENEMY TYPE DETECTED</div>
      <h2 id="intro-enemy-name" style="color: #00ffcc; font-size: 26px; text-shadow: 0 0 10px #00ffcc; margin-bottom: 10px;">SLASHER</h2>
      <canvas id="enemy-preview-canvas" width="130" height="130"></canvas>
      <p id="intro-enemy-desc" style="font-size: 12px; color: #b0d0e0; max-width: 360px; margin-bottom: 18px; line-height: 1.4;"></p>
      <button class="btn" id="enemy-intro-btn">ENGAGE</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="overlay hidden" id="gameover-screen">
      <h1 class="over-title">OVERWHELMED</h1>
      <p id="final-score">Final Score: 0 Kills</p>
      <button class="btn" id="restart-btn">TRY AGAIN</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
